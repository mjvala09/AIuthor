version = "0.1.0"
description = "AI Agentic Book Writer Backend"
authors = ["AI Engineer <ai@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
google-genai = "*"
google-generativeai = "*"
openai = "*"
reportlab = "*"
python-docx = "*"
numpy = "*"
duckduckgo_search = "*"
